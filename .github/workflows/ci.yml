# Phase 15 CI: the full test suite and a real Docker build + smoke test on
# every push to main and every pull request. Render deploys a commit on
# main only after these checks pass (render.yaml: autoDeployTrigger:
# checksPass). No cloud credentials are used or needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The suite needs the generated feature dataset and the Phase 7 model
      # path; neither is committed. Both are provisioned from committed
      # sources -- the seeded data pipeline (fingerprint verified) and the
      # packaged registered model -- nothing is retrained.
      - name: Regenerate feature dataset
        run: python -m src.data.regenerate_feature_dataset

      - name: Provision Phase 7 model path from the packaged model
        run: python -m src.models.provision_tuned_model

      - name: Run test suite (skips fail the run)
        env:
          FAIL_ON_SKIPPED_TESTS: "1"
        run: python -m pytest -q -rs --junitxml=pytest-results.xml

      - name: Test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("pytest-results.xml"):
              print("No pytest results were produced."); raise SystemExit
          suite = ET.parse("pytest-results.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          total, failed, errors, skipped = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print("| Collected | Passed | Failed | Errors | Skipped |")
          print("|---|---|---|---|---|")
          print(f"| {total} | {total - failed - errors - skipped} | {failed} | {errors} | {skipped} |")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build API and dashboard images
        run: docker compose build

      - name: Start stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test API and dashboard
        run: python3 scripts/smoke_test.py --api-url http://localhost:8000 --dashboard-url http://localhost:8501 --wait 60

      - name: Dashboard reaches the API over the Compose network
        run: |
          docker compose exec -T dashboard python -c "
          from dashboard import api_client
          result = api_client.get_health()
          print(api_client.get_api_base_url(), result.status_code, result.data)
          assert result.ok, result.error
          "

      - name: Container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down
