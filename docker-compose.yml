# Phase 13/15: run the existing Customer Retention Intelligence stack as two
# containers on Compose's default (automatically created) network, which
# lets each service resolve the other by its service name.
#
#   Browser -> dashboard (Streamlit, host port 8501)
#                  | HTTP, using the "api" service name -- never localhost
#                  v
#              api (FastAPI, host port 8000)
#                  |
#                  v
#          packaged MLflow registered model / SHAP / recommendation code
#
# Phase 15: both images are self-contained -- the packaged registered model
# (models/registered/) is copied in and the feature dataset is regenerated
# at build time from the committed, seeded pipeline (see Dockerfile.api).
# No host bind mounts are needed, so the Phase 13 mounts of mlruns.db,
# mlartifacts/ (including its developer-machine absolute path) and
# data/processed/ are gone, and this file works from any checkout location.
# The same images are what Render builds from render.yaml.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      # Container-to-container communication uses the Compose service
      # name "api", not localhost -- inside the dashboard container,
      # localhost refers to the dashboard container itself.
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
