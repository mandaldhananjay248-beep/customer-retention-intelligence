# Phase 10 MLflow tracking configuration.
#
# Local, file/SQLite-backed setup -- no cloud infrastructure required.
# `backend_store_uri` and `artifact_location` are resolved relative to the
# project root by src/models/mlflow_tracking.configure_tracking(), so this
# works the same way regardless of the caller's current working directory.
# Both mlruns.db and mlartifacts/ are generated locally and are excluded
# from version control (see .gitignore) -- they are reproducible from this
# config plus the already-tracked Phase 7 model artifact and reports.

tracking:
  backend_store_uri: "sqlite:///mlruns.db"
  artifact_location: "mlartifacts"

experiment:
  name: "customer-churn-prediction"

registry:
  model_name: "customer-churn-logistic-regression"

model:
  # mlflow.sklearn's default "skops" serialization flags this pipeline's
  # numpy.dtype objects (inside its ColumnTransformer) as untrusted and
  # refuses to save it. "pickle" is used instead, consistent with how the
  # Phase 7 artifact is already persisted (joblib, which is itself a
  # pickle-based format) -- this is our own trusted, locally-produced
  # model, not one loaded from an untrusted third party.
  serialization_format: "pickle"

# The frozen Phase 7 selection. load_registered_model() refuses to return
# anything that doesn't match this exactly -- see
# src/models/mlflow_tracking.validate_model_compatibility.
expected_model:
  model_type: "LogisticRegression"
  C: 0.01
  class_weight: "balanced"

# Phase 15: the exact Phase 10 registered model version, packaged as a
# plain MLflow model directory committed to the repo, so the API can load
# it on any machine (CI, Docker, Streamlit Cloud) without the local, machine-specific
# mlruns.db / mlartifacts registry state -- whose recorded artifact
# location is an absolute developer-machine path. The files are
# byte-for-byte copies of registry version 1's artifacts; nothing was
# retrained or re-serialized. `path` is resolved against the
# MODEL_ARTIFACT_ROOT environment variable if set, otherwise against
# models/registered/ in the project root. load_packaged_model() refuses to
# unpickle model.pkl unless its SHA-256 matches `model_sha256`.
packaged_model:
  path: "customer-churn-logistic-regression/1"
  version: "1"
  model_id: "m-beb0e30f078b44c29e15607c4582514c"
  run_id: "476233cecce9442c84e0b4ff3c1d5d54"
  model_sha256: "d4a3975471dcd8a4e35075bb94c2ec8c6f19a2bb3629da6fd0ac688039881da2"

random_seed: 42
